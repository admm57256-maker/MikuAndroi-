name: Build M-AI Miku APK

# ملف واحد يحتوي كل كود ميكو. يحتاج فقط وجود ملف ZIP الأصلي في المستودع (لأخذ صورة miku.png منه).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Miku project files
        run: |
          set -e
          mkdir -p MikuAndroid

          cat > 'MikuAndroid/settings.gradle' <<'MIKU_EOF_X9'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'MikuAndroid'
          include ':app'
          MIKU_EOF_X9

          cat > 'MikuAndroid/build.gradle' <<'MIKU_EOF_X9'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          MIKU_EOF_X9

          cat > 'MikuAndroid/gradle.properties' <<'MIKU_EOF_X9'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          MIKU_EOF_X9
          mkdir -p "MikuAndroid/app"
          cat > 'MikuAndroid/app/build.gradle' <<'MIKU_EOF_X9'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.mai.miku'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mai.miku'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }


          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          MIKU_EOF_X9
          mkdir -p "MikuAndroid/app/src/main"
          cat > 'MikuAndroid/app/src/main/AndroidManifest.xml' <<'MIKU_EOF_X9'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application android:theme="@style/AppTheme" android:label="M-AI Miku" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MIKU_EOF_X9
          mkdir -p "MikuAndroid/app/src/main/res/values"
          cat > 'MikuAndroid/app/src/main/res/values/styles.xml' <<'MIKU_EOF_X9'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2fc0c8</item>
                  <item name="android:statusBarColor">#0d1219</item>
                  <item name="android:navigationBarColor">#171c26</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          MIKU_EOF_X9
          mkdir -p "MikuAndroid/app/src/main/java/com/mai/miku"
          cat > 'MikuAndroid/app/src/main/java/com/mai/miku/MainActivity.java' <<'MIKU_EOF_X9'
          package com.mai.miku;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import android.view.View;

          public class MainActivity extends Activity {
              private WebView web;
              private PermissionRequest pendingRequest;
              private WebViewAssetLoader assetLoader;
              private static final int AUDIO_PERMISSION = 41;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(0);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF171C26);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadsImagesAutomatically(true);
                  s.setSupportZoom(false);
                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
                  web.setWebViewClient(new WebViewClient() {
                      @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          boolean wantsAudio = false;
                          for (String r : request.getResources()) if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) wantsAudio = true;
                          if (wantsAudio && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              pendingRequest = request;
                              requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_PERMISSION);
                          } else request.grant(request.getResources());
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == AUDIO_PERMISSION && pendingRequest != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) pendingRequest.grant(pendingRequest.getResources());
                      else pendingRequest.deny();
                      pendingRequest = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          MIKU_EOF_X9
          mkdir -p "MikuAndroid/app/src/main/assets"
          cat > 'MikuAndroid/app/src/main/assets/index.html' <<'MIKU_EOF_X9'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>M-AI Miku</title>
          <link rel="manifest" href="manifest.webmanifest">
          <meta name="theme-color" content="#0d1219">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-title" content="Miku">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <link rel="icon" href="icon-192.png">
          <link rel="apple-touch-icon" href="icon-192.png">
          <style>
          :root{--teal:#2fc0c8;--bg:#171c26;--head:#0d1219;--bubble:#2b3440;--mut:#9aa4b2;--ink:#06242a}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0}
          body{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--bg);color:#fff;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
          button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
          svg{display:block}
          .i{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

          /* header */
          #head{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--head);border-bottom:4px solid var(--teal)}
          .ic{width:38px;height:38px;display:grid;place-items:center;color:var(--teal);border-radius:50%}
          .ic svg{width:26px;height:26px}
          .ic:focus-visible,#plusBtn:focus-visible,#micBtn:focus-visible,#sendBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
          .av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #fff;flex-shrink:0}
          #head h1{flex:1;margin:0;font-size:24px;font-weight:800;color:var(--teal);white-space:nowrap}
          #head h1 i{font-style:normal;font-size:16px;vertical-align:top;margin-inline-start:2px}
          #hAv.talking{animation:talk .3s infinite}
          @keyframes talk{50%{transform:scale(1.08)}}
          #hAv.searching{box-shadow:0 0 0 5px #2fc0c866;animation:blink 1s infinite}
          #callBtn.off{opacity:.35}

          /* menu */
          #menu{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));left:10px;width:min(300px,92%);background:#1d242f;border:1px solid var(--teal);border-radius:18px;padding:14px;z-index:50;display:none;flex-direction:column;gap:10px;box-shadow:0 10px 30px #0008}
          #menu.open{display:flex}
          #menu{max-height:calc(100dvh - 90px);overflow-y:auto}
          #menu .row2{display:flex;gap:6px}
          #menu button{flex:1;padding:9px 6px;border-radius:12px;background:var(--bubble);font-size:14px}
          #menu button.on{background:var(--teal);color:var(--ink);font-weight:700}
          #menu .stat{font-size:13px;color:var(--mut);line-height:1.8}
          #menu .danger{color:#ff7b7b}
          #menu .cp{font-size:11px;color:var(--mut);text-align:center}

          /* chat */
          #chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
          .row{display:flex;align-items:flex-start;gap:10px;max-width:100%}
          .row.user{justify-content:flex-end}
          .row .av{width:56px;height:56px}
          .col{display:flex;flex-direction:column;gap:6px;max-width:78%}
          .row.ai .col{align-items:flex-start}
          .row.user .col{align-items:flex-end}
          .bubble{padding:16px 24px;border-radius:28px;font-size:19px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
          .ai .bubble{background:var(--bubble);cursor:pointer}
          .user .bubble{background:var(--teal);color:var(--ink);font-weight:600}
          .bubble a{color:#7cc4ff}
          .bubble .thumb{display:block;width:100%;border-radius:14px;margin-top:10px}
          .bubble.typing{opacity:.6;animation:blink 1s infinite}
          @keyframes blink{50%{opacity:.25}}
          .meta{font-size:13px;color:var(--mut);padding-inline:6px;direction:ltr}

          /* quick chips */
          #quick{display:none;gap:8px;padding:8px 14px 0;flex-wrap:wrap;justify-content:center}
          #quick.open{display:flex}
          #quick button{padding:8px 14px;border-radius:20px;border:1px solid var(--teal);color:var(--teal);font-size:14px}

          /* input bar */
          #bar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid #0006;direction:ltr}
          #plusBtn{width:40px;height:40px;color:var(--teal);display:grid;place-items:center;transition:transform .2s}
          #plusBtn.open{transform:rotate(45deg)}
          #plusBtn svg{width:36px;height:36px}
          #pill{flex:1;display:flex;align-items:center;background:var(--bubble);border-radius:30px;padding:0 14px 0 20px;height:56px}
          #input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:18px;direction:rtl;text-align:right}
          #input::placeholder{color:var(--mut)}
          #micBtn{width:38px;height:38px;color:var(--teal);display:grid;place-items:center;border-radius:50%}
          #micBtn.on{background:var(--teal);color:var(--ink)}
          #micBtn svg{width:26px;height:26px}
          #sendBtn{width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
          #sendBtn svg{width:28px;height:28px}

          /* login + toast */
          #login{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#1a0a2e,var(--head));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
          #login.hide{display:none}
          #login h1{color:var(--teal);margin:12px 0 4px}
          #login .av{width:110px;height:110px}
          #nameBox{background:#1e1e1e;border:1px solid var(--teal);border-radius:18px;padding:18px;width:100%;max-width:340px;margin-top:14px}
          #nameBox input{width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;margin:10px 0;outline:0;text-align:center}
          #nameBox button{width:100%;padding:13px;background:var(--teal);color:var(--ink);border-radius:12px;font-weight:700;font-size:17px}
          #nameBox .cancel{background:none;color:var(--mut);margin-top:6px;font-weight:400}
          #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bubble);border:1px solid var(--teal);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:90%;text-align:center}
          #toast.show{opacity:1}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style>
          </head>
          <body>

          <div id="login">
            <img class="av" data-av alt="">
            <h1>M-AI Miku</h1>
            <p>ذكاءك الاصطناعي المستقل<br>بتعلم من النت براهو، وبيجاوب بلا نت</p>
            <div id="nameBox">
              <div style="font-weight:700">اكتب اسمك عشان ميكو تعرفك</div>
              <input id="nameInput" placeholder="اكتب اسمك هنا..." maxlength="30" autocomplete="off">
              <button id="nameOk">دخول</button>
              <button class="cancel" id="nameCancel" style="display:none">إلغاء</button>
              <div style="font-size:12px;opacity:.6;margin-top:8px">بتكتبو مرة واحدة بس، واسمك بيتحفظ في متصفحك</div>
            </div>
            <div style="font-size:11px;opacity:.5;margin-top:12px">© عمر ادم عمر محمد يسف</div>
          </div>

          <header id="head" dir="ltr">
            <button class="ic" id="backBtn" aria-label="رجوع"><svg viewBox="0 0 24 24"><path class="i" d="M15 5l-7 7 7 7"/></svg></button>
            <img class="av" id="hAv" data-av alt="">
            <h1>M-AI Miku<i>✦</i></h1>
            <button class="ic" id="callBtn" aria-label="تشغيل أو إيقاف الصوت"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
            <button class="ic" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
          </header>

          <div id="menu">
            <div class="stat" id="stat"></div>
            <div class="row2"><button id="mOff">📴 بلا نت</button><button id="mAuto">⚡ تلقائي</button><button id="mOn">🌐 بي نت</button></div>
            <div class="stat">🧠 العقل الذكي (نموذج لغوي حقيقي على جهازك):</div>
            <div class="row2"><button id="llmSmall">⚡ صغير ~400MB</button><button id="llmMid">🧠 أذكى ~1.1GB</button></div>
            <div class="row2"><button id="llmOff">⛔ إيقاف العقل الذكي</button></div>
            <div class="row2"><button id="learnBtn">🧠 التعلم</button><button id="mikuBtn">🎤 صوت ميكو</button></div>
            <div class="row2"><button id="expBtn">💾 حفظ العقل</button><button id="impBtn">📂 استرجاع</button></div><input type="file" id="impFile" accept=".json,application/json" hidden>
            <div class="row2"><button id="diagBtn">🔧 فحص الاتصال</button></div>
            <div class="row2"><button id="installBtn" style="display:none">📲 تثبيت التطبيق</button><button id="nameBtn">✏️ تغيير الاسم</button></div>
            <div class="row2"><button id="mClear" class="danger">🗑️ مسح المحادثة</button><button id="mReset" class="danger">🧹 مسح الذاكرة</button></div>
            <div class="cp">© جميع الحقوق محفوظة لموقع عمر ادم عمر محمد يسف</div>
          </div>

          <main id="chat" dir="ltr" aria-live="polite"></main>

          <div id="quick">
            <button data-q="هلا">👋 هلا</button>
            <button data-q="غني لي">🎤 غني لي</button>
            <button data-q="بتفكري في شنو؟">🧠 بتفكري في شنو؟</button>
            <button data-q="ابحث عن السودان">🔍 ابحث عن السودان</button>
          </div>

          <div id="bar">
            <button id="plusBtn" aria-label="اقتراحات"><svg viewBox="0 0 24 24"><path class="i" d="M12 5v14M5 12h14"/></svg></button>
            <div id="pill">
              <input id="input" placeholder="اكتب رسالة..." autocomplete="off" enterkeyhint="send">
              <button id="micBtn" aria-label="إدخال صوتي"><svg viewBox="0 0 24 24"><rect class="i" x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path class="i" d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            </div>
            <button id="sendBtn" aria-label="إرسال"><svg viewBox="0 0 24 24"><path class="i" d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
          </div>
          <div id="toast"></div>

          <script>
          const $=id=>document.getElementById(id);
          const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
          const FALLBACK="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#fff"/><circle cx="32" cy="32" r="26" fill="#2fc0c8"/><text x="32" y="42" font-size="30" text-anchor="middle" fill="#fff" font-family="Arial">M</text></svg>');
          function avatar(img){img.onerror=()=>{img.onerror=null;img.src=FALLBACK};img.src="miku.png";return img}
          document.querySelectorAll("img[data-av]").forEach(avatar);
          const chat=$("chat");
          const time=()=>new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
          function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
          function norm(s){return String(s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").trim()}

          /* ---------- state ---------- */
          let myName=ls.get("proAI_userName","");
          const nm=()=>myName||"صديقي";
          let mode=ls.get("proAI_mode","auto");
          let voiceOn=ls.get("proAI_voice","on")!=="off";
          let mikuMode=ls.get("proAI_miku","on")!=="off";
          let learnOn=ls.get("proAI_learn","on")!=="off";
          let mood=ls.get("proAI_mood","happy"),love=parseInt(ls.get("proAI_love","70"))||70;
          let waitingTeach=null,busy=false;
          const llm={engine:null,mod:null,which:"",loading:false,q:Promise.resolve()};
          let memory=Object.create(null),brain=Object.create(null);
          const baseBrain={
          "السودان":"السودان بلد في شمال شرق أفريقيا، عاصمتو الخرطوم 🇸🇩",
          "الخرطوم":"الخرطوم عاصمة السودان، فيها ملتقى النيل الأزرق والنيل الأبيض",
          "ام درمان":"أم درمان مدينة كبيرة في العاصمة، على الضفة الغربية للنيل، ومن أكبر مدن السودان",
          "بورتسودان":"بورتسودان مدينة على البحر الأحمر، وهي الميناء الرئيسي للسودان",
          "النيل":"نهر النيل من أطول أنهار العالم، بيمر بالسودان ومصر",
          "النيل الازرق":"النيل الأزرق بينبع من إثيوبيا وبلتقي بالنيل الأبيض في الخرطوم",
          "مصر":"مصر جارة السودان، عاصمتها القاهرة",
          "السعودية":"السعودية دولة عربية عاصمتها الرياض، وفيها مكة والمدينة",
          "الارض":"الأرض هي الكوكب الثالث من الشمس، والوحيد المعروف بالحياة",
          "القمر":"القمر هو التابع الطبيعي الوحيد للأرض",
          "الشمس":"الشمس نجم، هي مركز المجموعة الشمسية وبتدي الأرض الضوء والدفا",
          "المريخ":"المريخ هو الكوكب الرابع من الشمس، ويسمى الكوكب الأحمر",
          "الفضاء":"الفضاء كبير شديد، فيهو مليارات المجرات والنجوم",
          "الماء":"الماء مركب كيميائي صيغته H2O، ضروري لكل الكائنات الحية",
          "الجاذبية":"الجاذبية قوة بتجذب الأجسام لبعضها، وهي البتخلينا ثابتين على الأرض",

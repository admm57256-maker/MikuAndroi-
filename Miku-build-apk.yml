            $("learnBtn").classList.toggle("on",learnOn);$("llmSmall").classList.toggle("on",!!llm.engine&&llm.which==="small");$("llmMid").classList.toggle("on",!!llm.engine&&llm.which==="mid");$("mikuBtn").classList.toggle("on",mikuMode);

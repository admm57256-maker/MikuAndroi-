          function addMsg(text,type){
            const row=document.createElement("div");row.className="row "+type;
            if(type==="ai")row.append(Object.assign(avatar(document.createElement("img")),{className:"av",alt:""}));
            const col=document.createElement("div");col.className="col";
            const bub=document.createElement("div");bub.className="bubble";bub.dir="auto";bub.textContent=text;
            const meta=document.createElement("div");meta.className="meta";
            meta.textContent=time()+" • "+(type==="ai"?"Read":"Delivered");
            col.append(bub,meta);row.append(col);chat.append(row);chat.scrollTop=chat.scrollHeight;
            if(type==="ai")bub.onclick=()=>speak(bub.textContent);
            return{row,bub,meta};
          }
          function botSay(t,sp=true){const m=addMsg(t,"ai");if(sp)speak(t);return m}
          function fillRich(b,r){
            b.textContent="";const t=document.createElement("b");t.textContent=(r.icon||"📚")+" "+r.title;
            const p=document.createElement("div");p.textContent=r.extract;p.style.marginTop="6px";b.append(t,p);
            if(/^https:\/\//.test(r.url)){const a=document.createElement("a");a.href=r.url;a.target="_blank";a.rel="noopener";a.textContent="اقرأ المزيد ←";a.style.display="block";a.style.marginTop="10px";b.append(a)}
            if(/^https:\/\//.test(r.thumb)){const im=document.createElement("img");im.className="thumb";im.src=r.thumb;im.alt="";b.append(im)}
          }

          /* ---------- voice ---------- */
          function pickVoice(){const v=window.speechSynthesis?speechSynthesis.getVoices()||[]:[];let x=v.find(a=>a.lang.startsWith("ar")&&/female|zira|aria|google/i.test(a.name))||v.find(a=>a.lang.startsWith("ar"))||v.find(a=>/zira|aria|samantha|female/i.test(a.name))||v[0];return x}
          if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
          function speak(t,queue){
            if(!voiceOn||!("speechSynthesis" in window))return;
            try{
              if(!queue)speechSynthesis.cancel();
              const c=String(t).replace(/https?:\/\/\S+/g,"").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}~•←]/gu," ").replace(/\s+/g," ").slice(0,500); /* emoji and symbols are not read aloud */if(!c.trim())return;
              const u=new SpeechSynthesisUtterance(c),v=pickVoice(),im=$("hAv");
              if(v)u.voice=v;u.lang="ar-SA";u.pitch=mikuMode?1.8:1.25;u.rate=mikuMode?1.1:1;
              u.onstart=()=>im.classList.add("talking");u.onend=u.onerror=()=>im.classList.remove("talking");
              speechSynthesis.speak(u);
            }catch(e){}
          }
          const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
          $("micBtn").onclick=()=>{
            if(!SR){toast("المتصفح ما بيدعم الإدخال الصوتي");return}
            try{
              const r=new SR();r.lang="ar-SA";r.interimResults=false;
              r.onresult=e=>{$("input").value=e.results[0][0].transcript;send()};
              r.onerror=()=>toast("ما قدرت أسمعك، جرب تاني");
              r.onend=()=>$("micBtn").classList.remove("on");
              $("micBtn").classList.add("on");r.start();
            }catch(e){$("micBtn").classList.remove("on")}
          };

          /* ---------- independent brain (runs fully offline) ---------- */
          const ctx={topic:null};
          let facts={};try{facts=JSON.parse(ls.get("proAI_facts","{}"))||{}}catch(e){}
          const saveFacts=()=>ls.set("proAI_facts",JSON.stringify(facts));
          const STOP=new Set("ما هو هي هم من منو شنو ايه ايش وين كيف ليه لماذا في على عن الى لي لك ممكن قول قوليلي احكي اشرح بتعرف بتعرفي تعرف تعرفي يا و او ان انو دي ده هذا هذه ابحث بحث عايز اعرف".split(" ").map(norm));
          const toks=s=>norm(s).split(/[\s؟?!.,،:;"'()]+/).filter(w=>w.length>=3&&!STOP.has(w));
          function topic(q){const t=norm(q).split(/[\s؟?!.,،:;"'()]+/).filter(w=>w&&!STOP.has(w));return t.join(" ")||q.trim()}
          const dg=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
          const looksLikeQuestion=t=>/[؟?]\s*$/.test(t)||/^(ما|منو|شنو|ايه|ايش|كيف|وين|ليه|هل|ابحث|بحث|علمني|احسب|كم)(\s|$)/.test(norm(t));
          function grams(s){s=" "+norm(s)+" ";const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));return g}
          function dice(a,b){const A=grams(a),B=grams(b);let n=0;A.forEach(x=>{if(B.has(x))n++});return 2*n/(A.size+B.size||1)}
          /* finds the best memory entry: exact/contained key, shared words, or a near-spelling (typos) */
          function searchBrain(q){
            const l=norm(q);let best=null,len=0,key=null;
            for(const st of [memory,brain])for(const k in st){const nk=norm(k);if(nk.length>=2&&nk.length>len&&(l===nk||l.includes(nk))){best=st[k];len=nk.length;key=k}}
            if(best){ctx.topic=key;return best}
            const qt=new Set(toks(q)),tp=topic(q);let sc=0;
            for(const st of [memory,brain])for(const k in st){
              const kt=toks(k);let r=kt.length&&qt.size?kt.filter(w=>qt.has(w)).length/kt.length:0;
              const dd=tp.length>=3?dice(tp,k):0;
              const v=Math.max(r>=0.6?r:0,dd>=0.72?dd:0);
              if(v>sc){sc=v;best=st[k];key=k}
            }
            if(best){ctx.topic=key;return best}
            return null;
          }
          /* calculator: understands digits, Arabic digits and words like ضرب / زائد */
          function calc(q){
            let e=dg(q.trim()).replace(/^(?:كم يساوي|كم|احسب لي|احسب|ناتج)\s*/,"").replace(/[=؟?]\s*$/,"").replace(/يساوي/g,"")
              .replace(/×|ضرب في|ضرب/g,"*").replace(/÷|قسمة على|قسمه على|على/g,"/").replace(/زائد|جمع/g,"+").replace(/ناقص/g,"-").replace(/\^/g,"**").replace(/،/g,"").trim();
            if(!/^[\d\s+\-*/().]+$/.test(e)||!/\d/.test(e)||!/[+\-*/]/.test(e.replace(/^\s*-/,""))||e.length>80)return null;
            if(/^[\d\s+-]{9,}$/.test(e)&&!/[*/]/.test(e))return null; /* looks like a phone number */
            try{const r=Function('"use strict";return ('+e+')')();if(typeof r!=="number"||!isFinite(r))return null;return e.replace(/\*\*/g,"^")+" = "+Number(r.toFixed(6))}catch(x){return null}
          }
          const JOKES=["واحد سأل صاحبو: ليه الكمبيوتر ما بيجوع؟ قال ليهو: لأنو عندو رام كتير 😂","الطالب قال للمعلم: أنا ما عملت شي يستاهل الصفر! المعلم قال: عارف، بس ما في أقل منو 😅","قالو لي: الصبر مفتاح الفرج. جربتو، لقيت الباب مقفول من جوه 😂","الواي فاي قال للشاحن: ما بقدر أعيش من غيرك... الشاحن قال: وأنا من غير الكهرباء ما بقدر 🔌","واحد قال لصاحبو: أنا بصحى بدري كل يوم. صاحبو قال: بتصحى متين؟ قال: الضهر بدري 😴"];
          /* returns {text,kind}: "chat" (small talk/tools), "brain" (from memory) or "teach" (waiting for an answer) */
          function localReply(q){
            const l=norm(q),R=(text,kind="chat")=>({text,kind}),T=t=>R(t,"tool");
            const mth=calc(q);if(mth)return T("🧮 "+mth);
            if(l.includes("بحبك")){changeMood("love",8);return R("وأنا كمان بحبك يا "+nm()+" 💖")}
            if(l.includes("شكرا")){changeMood("happy",3);return R("العفووو~ 🥰")}
            if(l.includes("غبي")||l.includes("بكرهك")){changeMood("sad",-12);return R("💔... وجعتني... سامحني؟")}
            if(l.includes("بتحسي بشنو"))return R("هسي أنا حاسة بـ "+(mood==="love"?"حب كبير ليك 💖":"سعادة 💙")+"، وحبي ليك "+love+"%.");
            if(l.includes("بتفكري في شنو"))return R("أنا هسي كنت بفكر فيك يا "+nm()+"...");
            if(/^(كيفك|كيف حالك|عامل كيف|اخبارك|شلونك|كيف الحال)/.test(l))return R(mood==="sad"?"عادي... بس كنت زعلانة شوية 💔 وانت كيفك؟":"الحمد لله، مبسوطة شديد 💙 وانت عامل كيف يا "+nm()+"؟");
            if(/^(مع السلام[ةه]|باي|تصبح على خير|يلا سلام)/.test(l))return R("مع السلامة يا "+nm()+" 👋 أنا هنا متين ما رجعت.");
            if(/نكته|نكتة|اضحكني|ضحكني/.test(l))return R(JOKES[Math.floor(Math.random()*JOKES.length)]);
            if(/بتقدري|بتعملي شنو|تقدري تعملي|مساعده|مساعدة/.test(l))return R("أقدر: أتكلم معاك 💬، أحسب لك (مثلا: 25 × 4)، أقول ليك الوقت والتاريخ، أحفظ اسمك وبعض معلوماتك، وأتعلم منك: اكتب «علمني ...» أو قول «السودان هو بلد...». ولو في نت بسأل النت لو ما عرفت.");
            if(/اسمي شنو|انا منو/.test(l))return T(myName?"انت اسمك "+myName+"، وحفظتو في متصفحك.":"لسه ما عرفت اسمك 😅 قول لي: اسمي ...");
            const nmM=q.trim().match(/^(?:[أا]نا\s+)?اسمي\s+(.{2,30})$/);
            if(nmM&&!/شنو|ايه|منو/.test(nmM[1])){myName=nmM[1].trim();ls.set("proAI_userName",myName);updateStats();return T("تشرفنا يا "+myName+" 😄 حفظت اسمك.")}
            /* things the user tells about himself, and recalling them */
            const fr=q.trim().match(/^[أا]نا\s+من\s+(.{2,30})$/);
            if(fr&&!/وين/.test(fr[1])){facts.from=fr[1].trim();saveFacts();return T("حلو، "+facts.from+" 💙 حفظتها!")}
            if(/(انا من وين|من وين انا)/.test(l))return T(facts.from?"انت من "+facts.from+" 😄":"ما قلت لي لسه، انت من وين؟ قول: أنا من ...");
            const ag=dg(q).match(/^عمري\s+(\d{1,3})/);
            if(ag){facts.age=ag[1];saveFacts();return T("تمام، عمرك "+ag[1]+" سنة، حفظتها 👍")}
            if(/(عمري كم|كم عمري)/.test(l))return T(facts.age?"عمرك "+facts.age+" سنة":"ما قلت لي عمرك لسه، قول: عمري ...");
            const lk=q.trim().match(/^(?:[أا]نا\s+)?(?:بحب|احب)\s+(.{2,40})$/);
            if(lk&&!/شنو|ايه/.test(lk[1])){facts.likes=[...new Set([...(facts.likes||[]),lk[1].trim()])].slice(-12);saveFacts();return T("حلو! "+lk[1].trim()+" 💙 حفظت إنك بتحبو.")}
            if(/(بحب شنو|شنو بحب|اشياء بحبها)/.test(l))return T(facts.likes&&facts.likes.length?"بتحب: "+facts.likes.join("، ")+" 💙":"لسه ما قلت لي بتحب شنو. قول: بحب ...");
            if(l.startsWith("علمني")||l.startsWith("احفظ")){
              const c=q.replace(/^(علمني|احفظ)\s*(انو|أن|ان)?/i,"").trim();
              if(c.length>2){waitingTeach=norm(c);return R("تمام، وجواب '"+c+"' شنو؟ (أو اكتب: الغاء)","teach")}
              return R("قول لي شنو أتعلم، مثلا: علمني انو الخرطوم حارة");
            }
            /* learn from a plain statement like "X هو Y" */
            const st=q.trim().match(/^(.{2,40}?)\s+(هو|هي|يعني|عبارة عن|عباره عن)\s+(.{3,200})$/);
            if(st&&!/[؟?]\s*$/.test(q)&&!/^(ما|منو|شنو|ايه|ايش|هل|كيف|وين|ليه|انا|انت)(\s|$)/.test(norm(st[1]))&&toks(st[1]).length){
              const k=norm(st[1]);memory[k]=brain[k]=q.trim();saveAll();updateStats();ctx.topic=k;
              return T("فهمت ✅ حفظت إنو «"+st[1]+"» "+st[2]+" "+st[3].slice(0,60)+(st[3].length>60?"...":"")+"\nلو سألتني عنو حأجاوبك.");
            }
            if(/^(هلا+|اهلا|مرحبا|سلام|السلام)(?![\u0621-\u064A])/.test(l)){changeMood("happy",2);return R("هلااااا~ يا "+nm()+" 😄 عامل كيف؟ اشتقت ليك!")}
            if(l.includes("غني")){changeMood("excited",4);return R("لا لا لا لاااا~ أنا ميكو بغني ليك 💙🎤\nقلبي بيدق لما أشوفك يا "+nm()+"~")}
            if(l.includes("منو انت")||l.includes("من انت"))return R("أنا ميكو 🤖💙 ذكاء اصطناعي مستقل شغال في جهازك بلا نت. برد ليك من ذاكرتي، وبتعلم منك ومن النت لما يكون موجود.");
            if(/اليوم شنو|اي يوم|ايش اليوم/.test(l))return T("اليوم "+new Date().toLocaleDateString("ar",{weekday:"long"}));
            if(l.includes("الساعة"))return T("هسي الساعة "+new Date().toLocaleTimeString("ar"));
            if(l.includes("التاريخ"))return T("اليوم "+new Date().toLocaleDateString("ar"));
            if(mode!=="online"){const b=searchBrain(l);if(b)return R("🧠 "+b,"brain")}
            return null;
          }

          /* ---------- web search (runs in parallel with the reply) ---------- */
          function xhrJson(u,ms){
            return new Promise((res,rej)=>{
              const x=new XMLHttpRequest();x.open("GET",u);x.timeout=ms;
              x.onload=()=>{if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText))}catch(e){rej(e)}}else rej(new Error("http "+x.status))};
              x.onerror=()=>rej(new TypeError("xhr"));
              x.ontimeout=()=>{const e=new Error("timeout");e.name="TimeoutError";rej(e)};
              x.send();
            });
          }
          /* no AbortController/signal: some hosts (webviews, preview frames) proxy fetch and can't pass an AbortSignal */
          async function jget(u,ms=12000,tries=2){
            for(let i=0;i<tries;i++){
              let timer;
              try{
                const r=await Promise.race([fetch(u),new Promise((_,rej)=>{timer=setTimeout(()=>{const e=new Error("timeout");e.name="TimeoutError";rej(e)},ms)})]);
                if(!r.ok)throw new Error("http "+r.status);
                return await r.json();
              }catch(e){
                if(e.name!=="TimeoutError"&&!/^http /.test(e.message||"")){
                  try{return await xhrJson(u,ms)}catch(e2){e=e2}
                }
                if(i===tries-1)throw e;
              }finally{clearTimeout(timer)}
            }
          }
          const why=e=>e&&(e.name==="AbortError"||e.name==="TimeoutError")?"انتهى الوقت (النت بطيء)":e&&e.name==="TypeError"?"تعذر الاتصال (النت أو حظر)":(e&&e.message)||"خطأ";
          async function wiki(lang,q){
            const d=await jget(`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&prop=extracts|pageimages|info&exintro=1&explaintext=1&exchars=700&piprop=thumbnail&pithumbsize=400&inprop=url&format=json&origin=*`);
            const p=d.query&&Object.values(d.query.pages||{})[0];
            if(!p||!p.extract)return null;
            return{title:p.title,extract:p.extract.trim(),url:p.fullurl||"",thumb:(p.thumbnail&&p.thumbnail.source)||"",source:lang==="ar"?"ويكيبيديا العربية":"Wikipedia (English)"};
          }
          async function ddg(q){
            const d=await jget("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1");
            const im=d.Image?(d.Image.startsWith("http")?d.Image:"https://duckduckgo.com"+d.Image):"";
            if(d.AbstractText)return{title:d.Heading||q,extract:d.AbstractText,url:d.AbstractURL||"",thumb:im,source:"DuckDuckGo"};
            const f=(d.RelatedTopics||[]).find(x=>x&&x.Text);
            if(f)return{title:q,extract:f.Text,url:f.FirstURL||"",thumb:"",source:"DuckDuckGo"};
            return null;
          }
          /* weather (Open-Meteo, no key needed) */
          const WMO={0:"صافي ☀️",1:"غالبا صافي 🌤️",2:"غائم جزئيا ⛅",3:"غائم ☁️",45:"ضباب 🌫️",48:"ضباب 🌫️",51:"رذاذ خفيف 🌦️",53:"رذاذ 🌦️",55:"رذاذ كثيف 🌦️",61:"مطر خفيف 🌧️",63:"مطر 🌧️",65:"مطر غزير 🌧️",71:"ثلج خفيف 🌨️",73:"ثلج 🌨️",75:"ثلج كثيف 🌨️",80:"زخات مطر 🌦️",81:"زخات مطر 🌧️",82:"زخات عنيفة ⛈️",95:"عاصفة رعدية ⛈️",96:"عاصفة رعدية وبرد ⛈️",99:"عاصفة رعدية وبرد ⛈️"};
          const WORDS_WEATHER=/^(طقس|الطقس|حراره|حرارة|الحراره|الحرارة|جو|الجو)$/,WORDS_NEWS=/^(اخبار|الاخبار|خبر|الخبر)$/;
          const wordsOf=t=>norm(t).split(/[\s؟?!.,،]+/).filter(Boolean);
          function webKind(t){const w=wordsOf(t);return w.some(x=>WORDS_WEATHER.test(x))?"weather":w.some(x=>WORDS_NEWS.test(x))?"news":"search"}
          function cityOf(t){const c=wordsOf(t).filter(x=>!WORDS_WEATHER.test(x)&&!/^(في|ب|هسي|الان|اليوم|شنو|كيف|ايه|كم|درجه|درجة|ابحث|بحث|عن|مدينه|مدينة)$/.test(x)).join(" ");return c||"الخرطوم"}
          async function weather(city){
            let g=await jget(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ar&format=json`);
            if(!(g.results&&g.results[0])&&city.startsWith("ال"))g=await jget(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.slice(2))}&count=1&language=ar&format=json`);
            const r=g.results&&g.results[0];
            if(!r)return{title:"الطقس",icon:"🌤️",extract:"ما لقيت مدينة اسمها «"+city+"». جرب تكتب اسمها بطريقة تانية.",url:"",thumb:"",source:"Open-Meteo",nolearn:true};
            const w=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
            const c=w.current;if(!c)return null;
            return{title:"الطقس في "+r.name,icon:"🌤️",extract:"🌡️ الحرارة: "+c.temperature_2m+"°\n💧 الرطوبة: "+c.relative_humidity_2m+"%\n💨 الرياح: "+c.wind_speed_10m+" كم/س"+(WMO[c.weather_code]?"\nالسماء: "+WMO[c.weather_code]:""),url:"",thumb:"",source:"Open-Meteo",nolearn:true};
          }
          async function wikiLite(lang,q){
            const d=await jget(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1&format=json&origin=*`);
            const h=d.query&&d.query.search&&d.query.search[0];if(!h)return null;
            const t=h.snippet.replace(/<[^>]*>/g,"").replace(/&quot;/g,'"').replace(/&amp;/g,"&").trim();
            return{title:h.title,extract:t+"...",url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(h.title.replace(/ /g,"_"))}`,thumb:"",source:"ويكيبيديا (ملخص قصير)"};
          }
          async function webSearch(q,kind="search",raw=""){
            const errs=[];
            if(kind==="weather"){try{const r=await weather(cityOf(raw||q));if(r)return r}catch(e){errs.push("الطقس: "+why(e))}}
            if(kind==="news"){try{const r=await ddg(q+" اخبار news");if(r){r.icon="📰";r.source="أخبار (DuckDuckGo)";r.nolearn=true;return r}}catch(e){errs.push("الأخبار: "+why(e))}}
            const g=(n,p)=>{p.catch(e=>errs.push(n+": "+why(e)));return p};
            const a=g("ويكيبيديا العربية",wiki("ar",q)),l=g("ويكيبيديا (خفيف)",wikiLite("ar",q)),d=g("DuckDuckGo",ddg(q)),e=g("Wikipedia EN",wiki("en",q));
            [l,d,e].forEach(x=>x.catch(()=>{}));
            const ra=await Promise.allSettled([a]);
            if(ra[0].status==="fulfilled"&&ra[0].value)return ra[0].value;
            const rest=await Promise.allSettled([d,e,l]);
            if(![...ra,...rest].some(x=>x.status==="fulfilled")){const er=new Error("net");er.details=errs;throw er}
            for(const x of rest)if(x.status==="fulfilled"&&x.value)return x.value;
            return null;
          }
          let activeSearches=0;
          function searching(n){activeSearches+=n;$("hAv").classList.toggle("searching",activeSearches>0)}

          async function send(){
            const inp=$("input"),txt=inp.value.trim();
            if(!txt)return;
            inp.value="";closeMenu();
            const u=addMsg(txt,"user");
            u.meta.textContent=time()+" • Read";
            /* answer to a pending "teach me" question */
            if(waitingTeach&&looksLikeQuestion(txt))waitingTeach=null;
            if(waitingTeach){
              const k=waitingTeach;waitingTeach=null;
              if(/^(الغاء|إلغاء|لا)$/.test(txt)){botSay("تمام، لغيت التعليم 👍");return}
              memory[k]=txt;brain[k]=txt;saveAll();updateStats();
              botSay("حفظتها ✅ لو سألتني عن '"+k+"' حأجاوبك طوالي.");return;
            }
            let explicit=/^(ابحث|بحث)/.test(txt);
            let tq=topic(txt);
            if(/^(كمان|اكتر|زيدني|وبعدين)/.test(norm(txt))&&ctx.topic){explicit=true;tq=ctx.topic}
            const wk=webKind(txt),live=wk==="weather"||wk==="news";
            const local=(explicit||live)?null:localReply(txt);
            if(local&&local.kind==="teach"){botSay(local.text);return}
            if(llm.engine&&!explicit&&!live&&!(local&&local.kind==="tool")){llm.q=llm.q.then(()=>llmAnswer(txt)).catch(()=>{});return}
            const canNet=mode!=="offline"&&navigator.onLine;
            if(live&&!canNet){botSay("الطقس والأخبار محتاجين نت 📴 وما في نت هسي.");return}
            const doSearch=canNet&&!local&&tq.length>=2; /* memory first; the web is only a helper */

            /* 1) start searching right now, in the background */
            let sp=null;
            if(doSearch){searching(1);sp=webSearch(tq,wk,txt)}

            /* 2) reply immediately while the search runs */
            if(local)botSay(local.text);
            else if(doSearch)botSay("ثواني يا "+nm()+"، بسأل النت عن «"+tq+"» وأرجع ليك 🔎");
            else{
              const b=searchBrain(tq);
              if(b){botSay("🧠 من راسي بلا نت: "+b);return}
              waitingTeach=norm(tq);
              botSay("والله دي لسه ما اتعلمتها 🤔 وما عندي نت أسأل منو.\nعلمني، جواب '"+tq+"' شنو؟ (أو اكتب: الغاء)");
              return;
            }

            /* 3) when the web answer arrives, add it as a follow-up message */
            const h=addMsg("🔎 ببحث في النت...","ai");h.bub.classList.add("typing");
            let r=null,err=false;
            let details=[];
            try{r=await sp}catch(e){err=true;details=e.details||[why(e)]}
            searching(-1);h.bub.classList.remove("typing");
            if(r){
              ctx.topic=tq;fillRich(h.bub,r);
              const src=document.createElement("div");src.className="meta";src.textContent="المصدر: "+r.source;h.bub.append(src);
              if(learnOn&&!r.nolearn&&tq.length>=3){brain[norm(tq)]=r.extract.slice(0,500);saveAll();updateStats()}
              speak("لقيت ليك: "+r.extract.slice(0,250),true);
            }else if(local){
              h.row.remove(); /* already answered from memory, nothing new online */
            }else{
              const b=searchBrain(tq);
              h.bub.textContent=b?"🧠 من راسي: "+b:err?"ما عندي معلومة عن «"+tq+"» ولا قدرت أسأل النت هسي 📴\nعلمني انت: اكتب «علمني ...» أو قول «"+tq+" هو ...»":"ما لقيت معلومة عن «"+tq+"» في النت. جرب كلمات تانية أو علمني انت 🙂";
              if(!b){[["🔍 قوقل","https://www.google.com/search?q="],["▶️ يوتيوب","https://www.youtube.com/results?search_query="],["📚 ويكيبيديا","https://ar.wikipedia.org/wiki/Special:Search?search="]].forEach(([n,u])=>{const a=document.createElement("a");a.href=u+encodeURIComponent(tq);a.target="_blank";a.rel="noopener";a.textContent=n+" ←";a.style.cssText="display:block;margin-top:8px";h.bub.append(a)})}
            }
            chat.scrollTop=chat.scrollHeight;
          }

          async function diagnose(){
            closeMenu();
            const m=addMsg("🔧 بفحص الاتصال... (ممكن ياخد لحدي نص دقيقة)","ai");m.bub.classList.add("typing");
            const out=["الجهاز يقول: "+(navigator.onLine?"متصل ✅":"بلا نت ❌"),"الصفحة مفتوحة من: "+(location.protocol==="file:"?"ملف محلي (ممكن يمنع الاتصال، ارفعه على رابط https)":location.origin)];
            const tests=[["ويكيبيديا العربية","https://ar.wikipedia.org/w/api.php?action=query&meta=siteinfo&format=json&origin=*"],["Wikipedia English","https://en.wikipedia.org/w/api.php?action=query&meta=siteinfo&format=json&origin=*"],["DuckDuckGo","https://api.duckduckgo.com/?q=test&format=json"]];
            await Promise.all(tests.map(async([n,u],i)=>{
              const t0=performance.now();
              try{await jget(u,15000,1);out[i+2]=n+": ✅ "+((performance.now()-t0)/1000).toFixed(1)+" ث"}
              catch(e){out[i+2]=n+": ❌ "+why(e)}
            }));
            m.bub.classList.remove("typing");m.bub.textContent=out.join("\n");
          }
          $("diagBtn").onclick=diagnose;
          $("expBtn").onclick=()=>{const b=new Blob([JSON.stringify({v:1,name:myName,memory,brain,facts})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="miku-brain.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);closeMenu();toast("💾 حفظت نسخة من عقل ميكو")};
          $("impBtn").onclick=()=>$("impFile").click();
          $("impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());let n=0;for(const k in(d.brain||{})){brain[k]=String(d.brain[k]);n++}for(const k in(d.memory||{}))memory[k]=String(d.memory[k]);if(d.facts)Object.assign(facts,d.facts);saveAll();saveFacts();updateStats();closeMenu();toast("📂 استرجعت "+n+" معلومة")}catch(x){toast("الملف ما صحيح")}e.target.value=""};

          /* ---------- smart brain: a real language model that runs on the device (WebLLM + WebGPU) ---------- */
          const LLM_URL="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.84/+esm";
          const LLM_PICK={small:/^Qwen2\.5-0\.5B-Instruct-q4f16_1/,mid:/^Qwen2\.5-1\.5B-Instruct-q4f16_1/};
          const hist=[];
          async function loadLLM(which,silent){
            if(llm.loading)return;
            if(!navigator.gpu){botSay("العقل الذكي محتاج WebGPU، وجهازك أو متصفحك ما بيدعمو (جرب كروم حديث على جوال قوي). ميكو حتكمل بالوضع العادي 💙",false);return}
            llm.loading=true;updateStats();
            const m=silent?null:addMsg("⏳ بجهز العقل الذكي... أول مرة بينزل ملف كبير، خليك على واي فاي ولا تقفل الصفحة","ai");
            const show=t=>{if(m)m.bub.textContent=t};
            try{
              if(!llm.mod)llm.mod=await import(LLM_URL);
              const id=llm.mod.prebuiltAppConfig.model_list.map(x=>x.model_id).find(x=>LLM_PICK[which].test(x));
              if(!id)throw new Error("النموذج غير موجود في هذه النسخة من المكتبة");
              if(llm.engine&&llm.engine.unload)await llm.engine.unload();
              llm.engine=await llm.mod.CreateMLCEngine(id,{initProgressCallback:p=>show("⏳ تجهيز العقل الذكي: "+Math.round((p.progress||0)*100)+"%")});
              llm.which=which;ls.set("proAI_llm",which);
              show("✅ العقل الذكي شغال! هسي بقدر أتكلم معاك في أي موضوع، وبرد من جهازك نفسو.");
            }catch(e){llm.engine=null;show("ما قدرت أشغل العقل الذكي: "+why(e)+"\nميكو حتكمل بالوضع العادي.")}
            llm.loading=false;updateStats();
          }
          async function stopLLM(){try{if(llm.engine&&llm.engine.unload)await llm.engine.unload()}catch(e){}llm.engine=null;llm.which="";ls.del("proAI_llm");hist.length=0;updateStats();toast("العقل الذكي اتقفل، رجعنا للوضع العادي")}
          const needsFacts=t=>!/^(كيفك|كيف حالك|كيف الحال)/.test(norm(t))&&(/[؟?]\s*$/.test(t)||/^(ما|ماذا|منو|من هو|شنو|ايه|ايش|متين|وين|كم|ليه|لماذا|هل|كيف|اشرح|عرف|حدثني)(\s|$)/.test(norm(t)));
          function systemPrompt(){
            const f=[];if(myName)f.push("اسم المستخدم: "+myName);if(facts.from)f.push("من: "+facts.from);if(facts.age)f.push("عمره: "+facts.age);if(facts.likes&&facts.likes.length)f.push("بيحب: "+facts.likes.join("، "));
            return "أنتِ ميكو، مساعدة ذكاء اصطناعي ودودة ومرحة، شخصيتك مستوحاة من هاتسوني ميكو. تتكلمين بالعربية بلهجة سودانية مبسّطة وواضحة. ردودك قصيرة ومفيدة (من جملتين إلى خمس) إلا لو طُلب منك تفصيل. إذا أُرفقت معلومات مساعدة فاعتمدي عليها. إذا لم تعرفي الجواب فقولي «ما أعرف» ولا تخترعي معلومات. لا تتظاهري أنك بشر."+(f.length?"\nمعلومات عن المستخدم: "+f.join("، ")+".":"");
          }
          async function llmAnswer(txt){
            const row=addMsg("…","ai");row.bub.classList.add("typing");
            const extra=[];
            const mem=searchBrain(txt);if(mem)extra.push("معلومة محفوظة في ذاكرة ميكو: "+mem);
            if(mode!=="offline"&&navigator.onLine&&needsFacts(txt)){ /* retrieval: look the topic up while thinking */
              searching(1);
              const r=await Promise.race([webSearch(topic(txt),"search",txt).catch(()=>null),new Promise(res=>setTimeout(()=>res(null),5000))]);
              searching(-1);
              if(r)extra.push("من النت ("+r.source+"): "+r.extract.slice(0,700));
            }
            const user=extra.length?txt+"\n\n[معلومات مساعدة، استخدمها لو فيها فايدة:\n"+extra.join("\n")+"]":txt;
            const messages=[{role:"system",content:systemPrompt()},...hist.slice(-8),{role:"user",content:user}];
            let out="";
            try{
              const stream=await llm.engine.chat.completions.create({messages,stream:true,temperature:0.7,max_tokens:400});
              row.bub.classList.remove("typing");row.bub.textContent="";
              for await(const ch of stream){const d=(ch.choices[0]&&ch.choices[0].delta&&ch.choices[0].delta.content)||"";if(d){out+=d;row.bub.textContent=out;chat.scrollTop=chat.scrollHeight}}
            }catch(e){row.bub.classList.remove("typing");if(!out){row.bub.textContent="العقل الذكي وقف: "+why(e)+"\nجرب ترسل تاني، أو أقفلو من القائمة.";return}}
            if(!out.trim()){row.bub.textContent="ما قدرت أرد 🤔 جرب تسألني بطريقة تانية.";return}
            hist.push({role:"user",content:txt},{role:"assistant",content:out});if(hist.length>12)hist.splice(0,hist.length-12);
            speak(out.slice(0,300));
          }
          $("llmSmall").onclick=()=>{closeMenu();loadLLM("small")};
          $("llmMid").onclick=()=>{closeMenu();loadLLM("mid")};
          $("llmOff").onclick=()=>{closeMenu();stopLLM()};

          /* ---------- name / login ---------- */
          function showLogin(cancelable){$("nameInput").value=myName;$("nameCancel").style.display=cancelable?"block":"none";$("login").classList.remove("hide");setTimeout(()=>$("nameInput").focus(),50)}
          function saveName(){
            const n=$("nameInput").value.trim();
            if(n.length<2){toast("اكتب اسمك أولا (حرفين على الأقل)");return}
            const first=!myName;myName=n;
            ls.set("proAI_userName",n);ls.set("proAI_userProfile",JSON.stringify({name:n}));
            $("login").classList.add("hide");updateStats();
            botSay(first?"هلااااا~ يا "+n+" 😄\nحفظت اسمك في متصفحك.\n\nداير نتكلم في شنو؟":"تمام يا "+n+"، غيرت اسمك ❤️");
          }
          $("nameOk").onclick=saveName;
          $("nameCancel").onclick=()=>$("login").classList.add("hide");
          $("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveName()});

          /* ---------- menu & controls ---------- */
          function closeMenu(){$("menu").classList.remove("open")}
          $("menuBtn").onclick=e=>{e.stopPropagation();updateStats();$("menu").classList.toggle("open")};
          document.addEventListener("click",e=>{if(!$("menu").contains(e.target))closeMenu()});
          $("backBtn").onclick=()=>{closeMenu();$("quick").classList.remove("open");$("plusBtn").classList.remove("open");if(history.length>1)history.back()};
          $("callBtn").onclick=()=>{voiceOn=!voiceOn;ls.set("proAI_voice",voiceOn?"on":"off");if(!voiceOn&&"speechSynthesis" in window)speechSynthesis.cancel();updateStats();toast(voiceOn?"الصوت شغال 🔊":"الصوت مقفول 🔇")};
          $("plusBtn").onclick=()=>{$("quick").classList.toggle("open");$("plusBtn").classList.toggle("open")};
          $("quick").addEventListener("click",e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){$("input").value=q;send()}});
          function setMode(m){mode=m;ls.set("proAI_mode",m);updateStats();toast(m==="offline"?"📴 بلا نت فقط":m==="online"?"🌐 بي نت فقط":"⚡ تلقائي")}
          $("mOff").onclick=()=>setMode("offline");$("mOn").onclick=()=>setMode("online");$("mAuto").onclick=()=>setMode("auto");
          $("learnBtn").onclick=()=>{learnOn=!learnOn;ls.set("proAI_learn",learnOn?"on":"off");updateStats();toast(learnOn?"🧠 ميكو حتتعلم من البحث":"التعلم الأوتوماتيكي مقفول")};
          $("mikuBtn").onclick=()=>{mikuMode=!mikuMode;ls.set("proAI_miku",mikuMode?"on":"off");updateStats();if(mikuMode)speak("هلااااا~ أنا ميكو")};
          $("nameBtn").onclick=()=>{closeMenu();showLogin(true)};
          $("mClear").onclick=()=>{chat.textContent="";waitingTeach=null;closeMenu();botSay("مسحت المحادثة بس 🗑️\nاسمك وذاكرتي لسه محفوظين يا "+nm()+".")};
          $("mReset").onclick=()=>{
            if(!confirm("تمسح كل ما اتعلمتو ميكو؟ (اسمك ما بيتمسح)"))return;
            ls.del("proAI_memory");ls.del("proAI_brain");ls.del("proAI_facts");facts={};memory=Object.create(null);brain=Object.create(null);seedBrain();
            waitingTeach=null;changeMood("sad",-5);closeMenu();botSay("مسحت ذاكرتي 🧹 ورجعت للمعلومات الأساسية بس.");
          };
          $("sendBtn").onclick=send;
          $("input").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
          window.addEventListener("online",()=>{updateStats();toast("🌐 رجع النت")});
          window.addEventListener("offline",()=>{updateStats();toast("📴 النت قطع، ميكو شغالة من ذاكرتها")});

          /* ---------- app (PWA): works offline + installable ---------- */
          if("serviceWorker" in navigator&&location.protocol!=="file:"){
            window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
          }
          let installEvt=null;
          const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
          window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("installBtn").style.display="block"});
          window.addEventListener("appinstalled",()=>{installEvt=null;$("installBtn").style.display="none";toast("تم تثبيت التطبيق ✅")});
          if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent))$("installBtn").style.display="block";
          $("installBtn").onclick=async()=>{
            if(installEvt){installEvt.prompt();await installEvt.userChoice;installEvt=null;$("installBtn").style.display="none"}
            else toast("في آيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»");
            closeMenu();
          };

          /* ---------- start ---------- */
          updateStats();
          {const sv=ls.get("proAI_llm","");if(sv&&LLM_PICK[sv]&&navigator.gpu)setTimeout(()=>loadLLM(sv,true).then(()=>{if(!llm.engine)toast("العقل الذكي ما اشتغل، ميكو بالوضع العادي")}),1200)}
          if(myName){$("login").classList.add("hide");botSay("هلااااا~ يا "+myName+" 😄\nداير نتكلم في شنو؟",false)}
          else showLogin(false);
          </script>
          </body>
          </html>
          MIKU_EOF_X9
          mkdir -p MikuAndroid/app/src/main/assets
          unzip -j -o MikuAndroid-humanlike-thinking.zip 'MikuAndroid/app/src/main/assets/miku.png' -d MikuAndroid/app/src/main/assets

      - name: Build debug APK
        working-directory: MikuAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-AI-Miku-debug-apk
          path: MikuAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

          /* ---------- ui helpers ---------- */
          function updateStats(){
            const moods={love:"💖 بتحبك شديد",sad:"💔 زعلانة",excited:"🤩 متحمسة",happy:"💙 مبسوطة"};
            const n=Object.keys(brain).length+Object.keys(memory).length;
            $("stat").innerHTML="";
            [["الحالة",navigator.onLine?"🌐 متصل بالنت":"📴 بلا نت"],["المزاج",moods[mood]||moods.happy],["حبها ليك",love+"%"],["عقل ميكو",n+" معلومة"],["الاسم",nm()],["العقل الذكي",llm.loading?"⏳ بيتجهز":llm.engine?"✅ شغال":"مقفول (الوضع العادي)"]].forEach(([a,b])=>{const d=document.createElement("div");d.textContent=a+": "+b;$("stat").append(d)});
